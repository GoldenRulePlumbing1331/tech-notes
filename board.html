<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14365c">
<meta name="robots" content="noindex">
<title>Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314365c'/%3E%3Crect x='25' y='12' width='14' height='26' rx='7' fill='%23f2b632'/%3E%3Cpath d='M18 32a14 14 0 0 0 28 0' stroke='%23f2b632' stroke-width='4' fill='none'/%3E%3Crect x='30' y='46' width='4' height='8' fill='%23f2b632'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --ink: #14181f; --muted: #5d6573; --line: #d5d9e0; --soft: #eef1f5; --grid: #e6e9ee;
    --brand: #14365c; --accent: #f2b632; --ok-bg: #e4f4e8; --ok-ink: #14532d;
    --err-bg: #fde8e8; --err-ink: #7f1d1d; --warn-bg: #fff4d6; --warn-ink: #6b4a00;
    --now: #d32f2f; --omw: #e69500; --work: #1e8e3e; --done: #7b8494;
    --hour: 64px; --rail: 46px; --colw: 150px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #191d23; --ink: #eef1f5; --muted: #9aa3b0; --line: #2e343d; --soft: #222831; --grid: #252b33;
      --ok-bg: #12301d; --ok-ink: #b9f0c9; --err-bg: #3a1515; --err-ink: #ffc9c9; --warn-bg: #3a2e10; --warn-ink: #ffe3a1;
      --now: #ff6b6b; --omw: #ffb84d; --work: #4cc274; --done: #8a93a3; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.35 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 0 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* top bar */
  #top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: calc(8px + env(safe-area-inset-top)) 10px 6px; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .dot { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); display: grid; place-items: center;
         color: var(--accent); font-weight: 800; flex: none; text-decoration: none; font-size: 14px; }
  .ib { flex: none; min-width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
        display: grid; place-items: center; cursor: pointer; padding: 0 10px; font-weight: 650; font-size: 15px; }
  .ib:active { background: var(--soft); }
  .ib svg { width: 20px; height: 20px; fill: currentColor; }
  .ib.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #dayBtn { position: relative; flex: 1; min-width: 0; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
            font-weight: 750; font-size: 16px; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
  #dayBtn small { font-weight: 600; color: var(--muted); margin-left: 6px; font-size: 13px; }
  #dayPick { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px 0 8px; border-radius: 17px; cursor: pointer;
          border: 1px solid var(--line); background: var(--card); font-weight: 650; font-size: 14px; white-space: nowrap; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c, #8a94a6); flex: none; }
  .chip em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 13px; }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .chip.on em { color: #cfd8e6; }
  .chip.off { color: var(--muted); }
  .chip.off i { background: transparent; border: 2px solid var(--c, #8a94a6); }
  .chip.act { padding: 0 12px; color: var(--brand); }
  @media (prefers-color-scheme: dark) { .chip.act { color: var(--accent); } .chip.on { background: #2b4a73; border-color: #2b4a73; } }
  .tools { display: flex; gap: 6px; padding-top: 8px; }
  .dd { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 10px; cursor: pointer;
        border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; white-space: nowrap; padding: 0 10px; }
  .dd svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
  .dd .caret { font-size: 11px; color: var(--muted); }
  .dd em { font-style: normal; font-weight: 650; color: var(--muted); }
  .dd .badge { font-style: normal; background: var(--warn-bg); color: var(--warn-ink); border-radius: 9px; padding: 1px 7px; font-size: 13px; font-weight: 800; }
  .dd .badge.zero { background: var(--soft); color: var(--muted); }
  .dd[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  #ddShade { position: fixed; inset: 0; z-index: 39; }
  #techMenu { position: fixed; z-index: 40; left: 10px; right: 10px; max-width: 420px; background: var(--card); border: 1px solid var(--line);
              border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.22); overflow: hidden; display: flex; flex-direction: column; }
  #techMenu .mh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #techMenu .mh b { flex: 1; font-size: 15px; }
  #techMenu .mh button { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  #techMenu .ml { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #techMenu .sec { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px 4px; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-top: 1px solid var(--grid); background: none; cursor: pointer; text-align: left; }
  .opt:active { background: var(--soft); }
  .opt .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; font-weight: 900; line-height: 1; }
  .opt.on .box { background: var(--brand); border-color: var(--brand); }
  @media (prefers-color-scheme: dark) { .opt.on .box { background: #3b6aa8; border-color: #3b6aa8; } }
  .opt i { width: 12px; height: 12px; border-radius: 50%; background: var(--c, #8a94a6); flex: none; }
  .opt .nm { flex: 1; min-width: 0; font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .opt:not(.on) .nm { color: var(--muted); }
  #techMenu .mf { padding: 10px 12px; border-top: 1px solid var(--line); }
  #techMenu .mf button { width: 100%; }
  .ugrp { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px; border-top: 1px solid var(--grid); }
  .ugrp:first-of-type { border-top: 0; }
  .ugrp.warn { color: var(--warn-ink); }
  .udate { font-size: 14px; font-weight: 750; padding: 8px 0 2px; }
  #sheet .row { padding: 9px 0; }
  .sub { display: flex; align-items: center; gap: 8px; padding-top: 6px; font-size: 13px; color: var(--muted); }
  .sub .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--card); padding: 6px 10px; font-weight: 650; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }
  .small { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 9px; font-weight: 650; font-size: 13px; cursor: pointer; flex: none; }
  .msg { margin: 6px 10px 0; border-radius: 10px; padding: 9px 12px; font-size: 14px; white-space: pre-wrap; }
  .msg.err { background: var(--err-bg); color: var(--err-ink); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .msg.busy { background: var(--soft); color: var(--muted); }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); }

  /* grid view */
  #scroller { overflow: auto; -webkit-overflow-scrolling: touch; position: relative; margin-top: 4px; overscroll-behavior: contain;
              scroll-snap-type: x proximity; scroll-padding-left: var(--rail); border-top: 1px solid var(--line); }
  #grid { display: grid; position: relative; min-width: 100%; }
  .corner { position: sticky; left: 0; top: 0; z-index: 12; background: var(--bg); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .head { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); border-right: 1px solid var(--grid);
          padding: 7px 8px 6px; scroll-snap-align: start; min-width: 0; cursor: pointer; }
  .head .nm { display: flex; align-items: center; gap: 6px; font-weight: 750; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .av { width: 24px; height: 24px; border-radius: 50%; background: var(--c, #8a94a6); color: #fff; display: grid; place-items: center;
        font-size: 11px; font-weight: 800; flex: none; }
  .head .nm span { overflow: hidden; text-overflow: ellipsis; }
  .head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .head .st { font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .st.omw { color: var(--omw); } .st.work { color: var(--work); } .st.done, .st.free { color: var(--muted); } .st.need { color: var(--warn-ink); }
  .st.link { color: var(--brand); text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .st.link { color: var(--accent); } }
  .adcorner { position: sticky; left: 0; z-index: 6; background: var(--bg); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
              font-size: 10px; color: var(--muted); text-align: right; padding: 4px 6px 0 0; }
  .adcell { border-bottom: 1px solid var(--line); border-right: 1px solid var(--grid); padding: 3px; min-width: 0; background: var(--card); }
  .rail { position: sticky; left: 0; z-index: 6; background: var(--bg); border-right: 1px solid var(--line); }
  .rail div { position: absolute; right: 5px; font-size: 11px; color: var(--muted); transform: translateY(-50%); white-space: nowrap; }
  .rail .nowlbl { color: #fff; background: var(--now); border-radius: 4px; padding: 0 3px; font-weight: 700; right: 2px; z-index: 2; }
  .col { position: relative; border-right: 1px solid var(--grid); min-width: 0;
         background-image: linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
         background-size: 100% var(--hour); }
  .nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
  .blk { position: absolute; border-radius: 7px; padding: 3px 5px 3px 7px; overflow: hidden; cursor: pointer; text-align: left;
         border: 1px solid var(--line); border-left: 4px solid var(--c, #8a94a6); background: var(--tint, var(--card)); color: var(--ink);
         font-size: 12px; line-height: 1.25; z-index: 2; }
  .blk:active { filter: brightness(.95); }
  @media (hover: hover) and (pointer: fine) { .blk.job[draggable="true"] { cursor: grab; } .blk.job[draggable="true"]:active { cursor: grabbing; } }
  .blk.dragging { opacity: .45; }
  .col.over, .head.over { background-color: rgba(242, 182, 50, .22); box-shadow: 0 0 0 2px var(--accent) inset; }
  .col.nodrop { background-color: rgba(211, 47, 47, .08); }
  #dragHint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 45; background: var(--brand); color: #fff;
              padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 650; box-shadow: 0 6px 20px rgba(0,0,0,.25); pointer-events: none; white-space: nowrap; }
  .blk b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .t { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .blk .d { display: block; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .blk .n { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .flag { display: block; font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk.omw .flag { color: var(--omw); } .blk.work .flag { color: var(--work); } .blk.done .flag { color: var(--done); }
  .blk.omw { border-left-color: var(--omw); }
  .blk.work { border-left-color: var(--work); box-shadow: 0 0 0 1px var(--work) inset; }
  .blk.done { opacity: .62; }
  .blk.est { border-style: dashed; border-left-style: solid; }
  .blk.event { background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 6px, var(--card) 6px, var(--card) 12px); border-left-color: var(--done); }
  .blk.tiny b { display: inline; } .blk.tiny .t { display: inline; margin-left: 4px; }
  .pill { display: block; width: 100%; border-radius: 6px; padding: 3px 6px; margin-bottom: 3px; font-size: 11.5px; font-weight: 650; cursor: pointer; text-align: left;
          border: 1px solid var(--line); border-left: 4px solid var(--c, #8a94a6); background: var(--tint, var(--soft)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.event { border-left-color: var(--done); background: var(--soft); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* list view */
  #list { padding: 8px 10px 30px; max-width: 760px; margin: 0 auto; }
  .tcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .tcard .th { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tcard .th .av { width: 34px; height: 34px; font-size: 13px; }
  .tcard .th b { display: block; font-size: 16px; }
  .tcard .th .x { flex: 1; min-width: 0; }
  .tcard .th .meta { font-size: 13px; color: var(--muted); }
  .tcard .th .st { font-size: 13px; }
  .row { display: flex; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--grid); cursor: pointer; align-items: flex-start; width: 100%;
         background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .row:first-of-type { border-top: 0; }
  .row:active { background: var(--soft); }
  .row .tm { width: 62px; flex: none; font-weight: 700; font-size: 13px; }
  .row .tm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .row .bd { flex: 1; min-width: 0; }
  .row .bd b { display: block; font-size: 15px; }
  .row .bd span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .am { flex: none; font-weight: 650; font-size: 13px; text-align: right; }
  .tag, .row .bd b .tag { display: inline-block; font-size: 11px; font-weight: 750; padding: 1px 6px; border-radius: 5px; margin-left: 4px; vertical-align: 1px; }
  .tag.omw { background: var(--warn-bg); color: var(--warn-ink); } .tag.work { background: var(--ok-bg); color: var(--ok-ink); }
  .tag.done { background: var(--soft); color: var(--muted); } .tag.est { background: var(--soft); color: var(--brand); }
  @media (prefers-color-scheme: dark) { .tag.est { color: var(--accent); } }

  /* detail sheet */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 50; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--card); border-radius: 18px 18px 0 0;
           max-height: 86vh; overflow: auto; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto;
           box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  #sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 10px; }
  #sheet h3 { margin: 0; font-size: 21px; }
  #sheet .kind { font-size: 13px; color: var(--muted); font-weight: 650; margin-bottom: 10px; }
  #sheet .kv { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--grid); font-size: 15px; }
  #sheet .kv span:first-child { width: 78px; flex: none; color: var(--muted); font-size: 13px; padding-top: 1px; }
  #sheet .kv a { color: var(--brand); font-weight: 650; }
  @media (prefers-color-scheme: dark) { #sheet .kv a { color: var(--accent); } }
  #sheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .btn { display: block; text-align: center; text-decoration: none; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 15px;
         border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
  .btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.full { grid-column: 1 / -1; }

  /* access code */
  #codeCard { max-width: 520px; margin: 30px auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  #codeCard label { display: block; font-weight: 650; margin-bottom: 6px; font-size: 17px; }
  #codeCard input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  #codeCard .btn { width: 100%; margin-top: 10px; }

  /* field tools in the job sheet + outbox */
  .ftools { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
  .ftools .ft { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 0 8px; }
  .fbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fb { border: 0; border-radius: 12px; padding: 14px 6px; color: #fff; font-weight: 800; font-size: 15px; line-height: 1.15; cursor: pointer; text-align: center; }
  .fb small { display: block; font-weight: 500; font-size: 11.5px; opacity: .92; margin-top: 4px; min-height: 14px; }
  .fb.omw { background: #1d4ed8; } .fb.start { background: #15803d; } .fb.finish { background: var(--brand); }
  .fb.done { opacity: .6; } .fb:active { filter: brightness(1.15); }
  .ftools .sub2 { font-size: 13px; color: var(--muted); margin: -2px 0 6px; }
  .lines { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 4px; }
  .lines .ln { display: flex; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--grid); font-size: 14px; align-items: baseline; }
  .lines .ln:first-child { border-top: 0; }
  .lines .ln .q { flex: none; width: 34px; color: var(--muted); } .lines .ln .nm { flex: 1; min-width: 0; } .lines .ln .pr { flex: none; font-weight: 650; }
  .lines .ln.tot { background: var(--soft); font-weight: 750; } .lines .ln.pend .nm { color: var(--warn-ink); }
  .lines .ln.none { color: var(--muted); }
  .ftools input.srch { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .hits { margin-top: 6px; }
  .hit { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 9px 11px; margin-top: 5px; font: inherit; color: inherit; cursor: pointer; }
  .hit:active { background: var(--soft); }
  .hit .nm { flex: 1; min-width: 0; font-size: 15px; } .hit .nm small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hit .pr { flex: none; font-weight: 700; }
  .hit.custom { border-style: dashed; color: var(--brand); }
  @media (prefers-color-scheme: dark) { .hit.custom { color: var(--accent); } }
  .addp { border: 1px solid var(--brand); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--card); }
  .addp .nm { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .addp .g { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .addp label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .addp input[type=text], .addp input[type=number] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
  .addp .chk { display: flex; gap: 14px; align-items: center; font-size: 14px; margin-top: 8px; }
  .addp .chk label { display: flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 600; }
  .addp .frow { margin-top: 10px; }
  .ftools textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 76px; resize: vertical; margin-top: 12px; }
  .frow { display: flex; gap: 8px; margin-top: 8px; }
  .frow .btn { flex: 1; padding: 11px; }
  .fmsg { margin-top: 8px; font-size: 14px; border-radius: 10px; padding: 8px 12px; }
  .fmsg.ok { background: var(--ok-bg); color: var(--ok-ink); } .fmsg.wait { background: var(--warn-bg); color: var(--warn-ink); } .fmsg.err { background: var(--err-bg); color: var(--err-ink); }

<body>

    </div>

      <button class="dd" id="unBtn"><svg viewBox="0 0 24 24"><path d="M19 3h-4.2a3 3 0 0 0-5.6 0H5v18h14zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm1 15h-2v-2h2zm0-4h-2V8h2z"/></svg><span>All unassigned</span><em class="badge zero" id="unCount">…</em></button>
    </div>

</div>
<div id="dragHint" class="hidden"></div>
<div id="shade" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>

<script src="config.js"></script>
<script>
(function () {
  var ENDPOINT = (window.GR_ENDPOINTS && window.GR_ENDPOINTS.dispatch) || "";
  var KEY = "grTechCode";
  var OLD_KEYS = ["grNewJobCode", "grDispatchCode"];
  var PREF = "grBoardPrefs", LAST = "grBoardLast";
  var REFRESH_MS = 120000, UN = "__un", UN_COLOR = "#8a94a6";
  function $(id) { return document.getElementById(id); }
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function show(el, on) { el.classList.toggle("hidden", !on); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function say(text, kind) { var m = $("msg"); m.textContent = text || ""; m.className = "msg" + (text ? " " + (kind || "warn") : " hidden"); sizeBoard(); }

  // hidden: techs switched off; shown: techs with nothing scheduled that were switched on anyway.
  var prefs = { hidden: {}, shown: {}, view: "grid", fit: 2, mine: false };
  try { var sp = JSON.parse(get(PREF) || "{}"); for (var k in sp) prefs[k] = sp[k]; } catch (e) {}
  delete prefs.showEmpty; if (!prefs.shown) prefs.shown = {}; if (!prefs.hidden) prefs.hidden = {};
  function savePrefs() { put(PREF, JSON.stringify(prefs)); }

  var S = { code: "", date: "", today: "", data: null, loading: false, scrolledFor: "", timer: null, offline: false, un: null, me: get("grBoardMe") || "" };
  function mineOn() { return !!(prefs.mine && S.me); }
  // Drag a job onto another tech's column to reassign it. Desktop only: a mouse/trackpad with hover, not a touch screen.
  var DRAG_OK = !!(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches);
  function canDrag() { return DRAG_OK && S.canDispatch !== false && !mineOn(); }

  // ---------- server ----------
  function api(action, data) {
    data = data || {}; data.action = action; data.token = S.code;
    if (ENDPOINT.indexOf("https://") !== 0) return Promise.resolve({ ok: false, error: "The board isn't connected yet. Add the Dispatch URL to config.js." });
    return fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: "Couldn't reach the server.", net: true }; });
  }

  // ---------- dates ----------
  function localDay(d) { d = d || new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function addDays(ymd, n) { var p = ymd.split("-").map(Number); var d = new Date(p[0], p[1] - 1, p[2] + n, 12); return localDay(d); }
  function dayLabel(ymd) { var p = ymd.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2], 12).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  function rel(ymd) { var t = S.today || localDay(); if (ymd === t) return "Today"; if (ymd === addDays(t, 1)) return "Tomorrow"; if (ymd === addDays(t, -1)) return "Yesterday"; return ""; }
  function hm(m, ap) { var h = Math.floor(m / 60) % 24, mm = m % 60, a = h < 12 ? "a" : "p", h12 = h % 12 || 12; return h12 + (mm ? ":" + ("0" + mm).slice(-2) : "") + (ap === false ? "" : a); }
  function range(it) { if (it.all_day) return "All day"; var a = hm(it.smin), b = hm(it.emin); if (a.slice(-1) === b.slice(-1)) a = a.slice(0, -1); return a + "–" + b; }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function money(n) { return "$" + Math.round(n).toLocaleString(); }
  function hours(n) { return (Math.round(n * 2) / 2) + "h"; }

  // ---------- model ----------
  function stateOf(it) {
    if (it.kind === "event") return "event";
    if (it.done || /complete/i.test(it.status || "")) return "done";
    if (it.started || /progress/i.test(it.status || "")) return "work";
    if (it.omw) return "omw";
    return "sched";
  }
  function flagText(it) {
    var s = stateOf(it);
    if (s === "done") return "✓ Done" + (it.done ? " " + it.done : "");
    if (s === "work") return "● Working" + (it.started ? " since " + it.started : "");
    if (s === "omw") return "➜ On the way " + it.omw;
    return "";
  }
  function techMap() { var m = {}; (S.data.techs || []).forEach(function (t) { m[t.id] = t; }); return m; }
  function columns() {
    var d = S.data, tm = techMap(), by = {}, order = [];
    by[UN] = [];
    (d.techs || []).forEach(function (t) { by[t.id] = []; });
    (d.items || []).forEach(function (it) {
      var ids = (it.employee_ids || []).filter(function (id) { return tm[id]; });
      if (!ids.length) by[UN].push(it); else ids.forEach(function (id) { by[id].push(it); });
    });
    var un = { id: UN, short: "Unassigned", name: "Unassigned", initials: "–", color: UN_COLOR, items: by[UN] };
    var techs = (d.techs || []).map(function (t) { return { id: t.id, short: t.short || t.name, name: t.name, initials: t.initials || t.name.charAt(0), color: t.color || "#4a6fa5", items: by[t.id] }; });
    techs.sort(function (a, b) { return (b.items.length ? 1 : 0) - (a.items.length ? 1 : 0) || a.name.localeCompare(b.name); });
    return [un].concat(techs);
  }
  function work(items) { return items.filter(function (it) { return it.kind !== "event"; }); }
  function stats(c) {
    var w = work(c.items), seen = {}, rev = 0, hrs = 0;
    w.forEach(function (it) { if (it.kind === "job" && !seen[it.job_id]) { seen[it.job_id] = 1; rev += it.amount || 0; } if (!it.all_day) hrs += Math.max(0, it.emin - it.smin) / 60; });
    return { n: w.length, rev: rev, hrs: hrs };
  }
  // Where is this tech right now? Only meaningful for today.
  function whereNow(c) {
    var w = work(c.items).filter(function (it) { return !it.all_day || it.kind === "job"; });
    if (c.id === UN && !w.length) { var n0 = unOpen(); return n0 ? { cls: "link", text: "None this day · " + n0 + " open ›", un: true } : { cls: "done", text: "Nothing unassigned" }; }
    if (!w.length) return { cls: "free", text: "Nothing scheduled" };
    if (c.id === UN) { var open = w.filter(function (it) { return stateOf(it) !== "done"; }); return open.length ? { cls: "need", text: open.length + (open.length === 1 ? " needs a tech" : " need a tech"), it: open[0] } : { cls: "done", text: "All covered" }; }
    if (S.data.date !== S.data.today) return { cls: "free", text: w.length + (w.length === 1 ? " stop" : " stops") };
    var on = w.filter(function (it) { return stateOf(it) === "work"; })[0];
    if (on) return { cls: "work", text: "● At " + on.customer + (on.started ? " · since " + on.started : ""), it: on };
    var drv = w.filter(function (it) { return stateOf(it) === "omw"; })[0];
    if (drv) return { cls: "omw", text: "➜ Driving to " + drv.customer + " · " + drv.omw, it: drv };
    var left = w.filter(function (it) { return stateOf(it) !== "done"; });
    if (!left.length) return { cls: "done", text: "✓ All done (" + w.length + ")" };
    var nm = nowMin(), next = left.filter(function (it) { return it.emin > nm; })[0] || left[0];
    return { cls: "free", text: "Next " + hm(next.smin) + " · " + next.customer, it: next };
  }
  // Unassigned is always there (like HCP) unless switched off; techs show when they have something that day or were
  // switched on by hand.
  function isOn(c) { if (mineOn()) return c.id === S.me; if (prefs.hidden[c.id]) return false; return c.id === UN || c.items.length > 0 || !!prefs.shown[c.id]; }
  function toggle(c) {
    if (isOn(c)) { prefs.hidden[c.id] = 1; delete prefs.shown[c.id]; }
    else { delete prefs.hidden[c.id]; if (c.id !== UN && !c.items.length) prefs.shown[c.id] = 1; }
    savePrefs();
  }
  function visible(cols) { return cols.filter(isOn); }
  function tint(hex) { return /^#[0-9a-f]{6}$/i.test(hex || "") ? hex + "22" : "rgba(138,148,166,.13)"; }

  // ---------- render: top ----------
  function renderTop() {
    var d = S.data;
    $("dayLbl").textContent = dayLabel(S.date);
    $("dayRel").textContent = rel(S.date);
    $("dayPick").value = S.date;
    show($("todayBtn"), S.date !== S.today);
    if (!d) { $("chips").innerHTML = ""; $("sum").textContent = ""; return; }
    var cols = columns(), box = $("chips"); box.innerHTML = "";
    var on = cols.filter(isOn).length;
    $("techCount").textContent = on + "/" + cols.length;
    var meKnown = !!S.me && cols.some(function (c) { return c.id === S.me; });
    show($("mineSeg"), meKnown);
    if (!meKnown && prefs.mine) { prefs.mine = false; savePrefs(); }
    $("vMine").classList.toggle("on", mineOn()); $("vAll").classList.toggle("on", !mineOn());
    show($("techBtn"), !mineOn()); show($("unBtn"), !mineOn()); show(box, !mineOn());
    if (mineOn()) { $("sum").textContent = "Showing only your jobs"; return; }
    // Quick toggles for whoever has something today (the Techs list has everyone).
    cols.filter(function (c) { return c.items.length || isOn(c); }).forEach(function (c) {
      var off = !isOn(c);
      var b = el("button", "chip " + (off ? "off" : "on")); b.style.setProperty("--c", c.color);
      b.appendChild(el("i")); b.appendChild(document.createTextNode(c.short)); b.appendChild(el("em", null, String(work(c.items).length)));
      b.setAttribute("aria-pressed", off ? "false" : "true");
      b.onclick = function () { toggle(c); render(); };
      box.appendChild(b);
    });
    var w = work(d.items || []), seen = {}, rev = 0, est = 0;
    w.forEach(function (it) { if (it.kind === "job" && !seen[it.job_id]) { seen[it.job_id] = 1; rev += it.amount || 0; } if (it.kind === "estimate") est++; });
    var jobs = Object.keys(seen).length;
    $("sum").textContent = jobs + (jobs === 1 ? " job" : " jobs") + (est ? " · " + est + " est." : "") + " · " + money(rev) +
      " · " + (S.offline ? "offline, " : "") + "as of " + (d.loaded_at || "");
  }

  // ---------- Techs dropdown (check marks) ----------
  function renderMenu() {
    var box = $("mList"); box.innerHTML = "";
    if (!S.data) { box.appendChild(el("div", "sec", "Loading…")); return; }
    var cols = columns(), busy = cols.filter(function (c) { return c.id === UN || c.items.length; }), idle = cols.filter(function (c) { return c.id !== UN && !c.items.length; });
    function row(c) {
      var on = isOn(c), n = work(c.items).length;
      var b = el("button", "opt" + (on ? " on" : "")); b.style.setProperty("--c", c.color);
      b.setAttribute("role", "menuitemcheckbox"); b.setAttribute("aria-checked", on ? "true" : "false");
      b.appendChild(el("span", "box", on ? "✓" : ""));
      b.appendChild(el("i"));
      b.appendChild(el("span", "nm", c.name));
      b.appendChild(el("small", null, c.id === UN ? (n ? n + " this day" : "none this day") : n ? n + (n === 1 ? " stop" : " stops") : "nothing scheduled"));
      b.onclick = function () { toggle(c); renderMenu(); render(); };
      return b;
    }
    box.appendChild(el("div", "sec", "On the schedule " + (S.date === S.today ? "today" : dayLabel(S.date))));
    busy.forEach(function (c) { box.appendChild(row(c)); });
    if (idle.length) { box.appendChild(el("div", "sec", "Nothing scheduled")); idle.forEach(function (c) { box.appendChild(row(c)); }); }
  }
  function openMenu() {
    renderMenu();
    var r = $("top").getBoundingClientRect(), m = $("techMenu");
    m.style.top = (r.bottom - 4) + "px";
    m.style.maxHeight = Math.max(240, window.innerHeight - r.bottom - 12) + "px";
    $("mList").style.maxHeight = Math.max(140, window.innerHeight - r.bottom - 130) + "px";
    show(m, true); show($("ddShade"), true); $("techBtn").setAttribute("aria-expanded", "true");
  }
  function closeMenu() { show($("techMenu"), false); show($("ddShade"), false); $("techBtn").setAttribute("aria-expanded", "false"); }
  $("techBtn").onclick = function () { if ($("techMenu").classList.contains("hidden")) openMenu(); else closeMenu(); };
  $("ddShade").onclick = closeMenu; $("mDone").onclick = closeMenu;
  $("mAll").onclick = function () { if (!S.data) return; prefs.hidden = {}; savePrefs(); renderMenu(); render(); };
  $("mNone").onclick = function () { if (!S.data) return; prefs.hidden = {}; prefs.shown = {}; columns().forEach(function (c) { prefs.hidden[c.id] = 1; }); savePrefs(); renderMenu(); render(); };

  // ---------- Unassigned jobs (any day) ----------
  function unOpen() { return S.un ? (S.un.items || []).length : 0; }
  function renderUnBtn() {
    var b = $("unCount");
    if (!S.un) { b.textContent = "…"; b.className = "badge zero"; return; }
    b.textContent = String(unOpen()); b.className = "badge" + (unOpen() ? "" : " zero");
  }
  function loadUn(fresh) {
    return api("unassigned", { fresh: !!fresh }).then(function (r) {
      if (r && r.ok) { S.un = r; try { put("grBoardUn", JSON.stringify(r)); } catch (e) {} }
      else if (!S.un) { try { S.un = JSON.parse(get("grBoardUn") || "null"); } catch (e) {} }
      renderUnBtn(); if (S.data) render();
      if (!$("sheet").classList.contains("hidden") && S.sheetIsUn) openUnassigned();
      return r;
    });
  }
  function urow(it) {
    var r = el("button", "row");
    var tm = el("div", "tm", it.group === "unscheduled" ? "—" : it.when.split(" · ")[1] || "");
    if (it.group === "unscheduled" && it.created) tm.appendChild(el("small", null, "added " + it.created));
    r.appendChild(tm);
    var bd = el("div", "bd"); var nm = el("b", null, it.customer); if (it.day_of) nm.appendChild(el("span", "tag est", it.day_of)); bd.appendChild(nm);
    bd.appendChild(el("span", null, it.title || "—"));
    if (it.address) bd.appendChild(el("span", null, it.address));
    r.appendChild(bd);
    r.appendChild(el("div", "am", it.amount ? money(it.amount) : "#" + it.number));
    r.onclick = function () { openSheet(it, null, openUnassigned); };
    return r;
  }
  function openUnassigned() {
    closeMenu();
    var sh = $("sheet"); sh.innerHTML = ""; sh.appendChild(el("div", "grab")); S.sheetIsUn = true; S.sheetOut = false;
    sh.appendChild(el("h3", null, "Unassigned jobs"));
    var u = S.un;
    if (!u) { sh.appendChild(el("div", "kind", "Loading…")); loadUn(false); }
    else {
      var items = u.items || [];
      sh.appendChild(el("div", "kind", (items.length ? items.length + (items.length === 1 ? " open job" : " open jobs") + " with nobody on " + (items.length === 1 ? "it" : "them") : "Every open job has a tech") + " · as of " + (u.loaded_at || "")));
      var past = items.filter(function (i) { return i.group === "past"; }), up = items.filter(function (i) { return i.group === "upcoming"; }), un = items.filter(function (i) { return i.group === "unscheduled"; });
      if (past.length) { sh.appendChild(el("div", "ugrp warn", "Past — still open (" + past.length + ")")); past.forEach(function (it) { sh.appendChild(el("div", "udate", it.when.split(" · ")[0])); sh.appendChild(urow(it)); }); }
      if (up.length) {
        sh.appendChild(el("div", "ugrp", "Scheduled, no tech (" + up.length + ")"));
        var last = "";
        up.forEach(function (it) { if (it.date !== last) { last = it.date; var r0 = rel(it.date); sh.appendChild(el("div", "udate", dayLabel(it.date) + (r0 ? " · " + r0 : ""))); } sh.appendChild(urow(it)); });
      }
      if (un.length) { sh.appendChild(el("div", "ugrp", "Needs scheduling (" + un.length + ")")); un.forEach(function (it) { sh.appendChild(urow(it)); }); }
      if ((u.warnings || []).length) sh.appendChild(el("div", "msg warn", "Some of the list couldn't load: " + u.warnings.join(" · ")));
    }
    var acts = el("div", "acts");
    var rf = el("button", "btn", "Refresh"); rf.onclick = function () { rf.textContent = "Refreshing…"; loadUn(true); }; acts.appendChild(rf);
    var cl = el("button", "btn", "Close"); cl.onclick = closeSheet; acts.appendChild(cl);
    sh.appendChild(acts);
    show($("shade"), true); show(sh, true);
  }
  $("unBtn").onclick = openUnassigned;

  // ---------- render: grid ----------
  function lanes(items) {
    var timed = items.filter(function (it) { return !it.all_day; }).slice().sort(function (a, b) { return a.smin - b.smin || b.emin - a.emin; });
    var out = [], cluster = [], laneEnds = [], clusterEnd = -1;
    function flush() { cluster.forEach(function (x) { x.n = laneEnds.length; }); cluster = []; laneEnds = []; }
    timed.forEach(function (it) {
      if (it.smin >= clusterEnd) { flush(); clusterEnd = -1; }
      var lane = -1; for (var i = 0; i < laneEnds.length; i++) if (laneEnds[i] <= it.smin) { lane = i; break; }
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
      laneEnds[lane] = Math.max(it.emin, it.smin + 30);
      var x = { it: it, lane: lane, n: 1 }; cluster.push(x); out.push(x);
      clusterEnd = Math.max(clusterEnd, laneEnds[lane]);
    });
    flush();
    return out;
  }
  function openBlock(it, c) { return function () { openSheet(it, c); }; }
  // ---------- drag a job to a tech (desktop) ----------
  var DRAG = null;   // { it, from }
  function dragSource(b, it, c) {
    b.draggable = true; b.title = "Drag onto a tech to reassign";
    b.addEventListener("dragstart", function (e) {
      DRAG = { it: it, from: c };

  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && S.code && S.date === S.today) load(false, true); });

  // ---------- access code ----------
  function showCode(msg) { show($("codeCard"), true); show($("app"), false); var m = $("codeMsg"); m.textContent = msg || ""; m.className = "msg" + (msg ? " err" : " hidden"); }
  function start(code) {
    S.code = code; put(KEY, code);
    show($("codeCard"), false); show($("app"), true);
    var q = (/[?&]date=(\d{4}-\d{2}-\d{2})/.exec(location.search) || [])[1];
    S.today = localDay(); S.date = q || S.today;
    try { S.un = JSON.parse(get("grBoardUn") || "null"); } catch (e) {} renderUnBtn();
    // Show the last board straight away when it's the same day (instant open, works with no signal).
    try { var last = JSON.parse(get(LAST) || "null"); if (last && last.date === S.date) { S.data = last; render(); } } catch (e) {}
    renderTop(); sizeBoard(); load(false);
    refreshOut(); loadPhotos().then(flushSoon); loadCatalog(false);
  }
  $("codeGo").onclick = function () { var c = $("code").value.trim(); if (c) start(c); };
  $("code").onkeydown = function (e) { if (e.key === "Enter") $("codeGo").click(); };
  $("forget").onclick = function (e) { e.preventDefault(); drop(KEY); drop(LAST); drop("grBoardUn"); drop("grBoardMe"); S.me = ""; S.un = null; S.code = ""; S.data = null; $("code").value = ""; showCode(""); };
  (function boot() {
    if (get(KEY)) return start(get(KEY));
    for (var i = 0; i < OLD_KEYS.length; i++) if (get(OLD_KEYS[i])) return start(get(OLD_KEYS[i]));
    showCode("");
  })();
})();
</script>
</body>
</html>
