<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14365c">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golden Rule">
<link rel="manifest" href="manifest.webmanifest">
<title>Tech Details</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="gr.css">
<style>
  label { margin-bottom: 8px; }
  .row { gap: 10px; align-items: stretch; }
  input, textarea { padding: 12px; }
  #job { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  textarea { min-height: 150px; }
  .mic { width: auto; height: auto; flex: 0 0 64px; display: grid; place-items: center; }
  .mic svg { width: 28px; height: 28px; }
  .mic.big { width: 100%; height: 64px; flex: none; margin-top: 10px; font-size: 18px; font-weight: 650; display: flex; }
  .toggle { display: flex; gap: 8px; margin-top: 12px; }
  .toggle button { flex: 1; padding: 11px; font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 10px;
                   border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  #send { width: 100%; padding: 18px; border: 0; border-radius: 12px; background: var(--accent);
          color: #1a1300; font-family: inherit; font-size: 19px; font-weight: 800; }
  #send:disabled { opacity: .55; }
  #msg { padding: 14px; margin-top: 14px; }
  .ob { border-top: 1px solid var(--line); padding: 10px 0; }
  .ob:first-child { border-top: 0; padding-top: 2px; }
  .ob b { display: block; }
  .ob .txt { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ob .st { font-size: 14px; margin-top: 4px; }
  .ob .st.err { color: var(--err-ink); }
  .ob .acts { display: flex; gap: 8px; margin-top: 8px; }
  .ob .acts button { flex: 1; padding: 9px; font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 9px;
                     border: 1px solid var(--line); background: var(--card); color: var(--ink); }
</style>
</head>
<body>
<header>
  <a class="dot" href="home.html" aria-label="All tools">GR</a>
  <h1>Tech Details</h1>
  <a class="nav" href="home.html">All tools →</a>
</header>

<div class="card hidden" id="codeCard">
  <label for="code">Your access code</label>
  <input id="code" inputmode="numeric" autocomplete="off" placeholder="8-digit code">
  <button class="btn" id="codeGo">Continue</button>
  <div class="status" id="codeMsg"></div>
  <div class="hint">One code works for every tool on this phone.</div>
</div>

<div id="app" class="hidden">
<div class="card">
  <label for="job">Job number</label>
  <div class="row">
    <input id="job" inputmode="numeric" autocomplete="off" placeholder="e.g. 49692">
    <button class="mic" id="micJob" aria-label="Say the job number">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
    </button>
  </div>
</div>

<div class="card">
  <label for="notes">What did you do?</label>
  <textarea id="notes" placeholder="Tap the microphone and talk. You can fix anything here before sending."></textarea>
  <button class="mic big" id="micNotes">
    <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
    <span id="micNotesLabel">Tap to talk</span>
  </button>
  <div class="toggle" role="group" aria-label="Replace or add">
    <button id="modeReplace" aria-pressed="true">New/Replace details</button>
    <button id="modeAppend" aria-pressed="false">Add to details</button>
  </div>
  <div class="hint">Details are cleaned up before they go on the invoice.</div>
</div>

<button id="send">Send to Housecall Pro</button>
<div id="msg" class="status" role="status" aria-live="polite"></div>

<div class="card hidden" id="outboxCard">
  <label>Waiting to send</label>
  <div class="hint" id="outboxHint">Saved on this phone. They send themselves when you're back in signal, or next time you open this page.</div>
  <div id="outboxList"></div>
</div>
</div>

<footer><a href="#" id="forget">Not you? Change code</a></footer>

<script src="config.js"></script>
<script src="gr-common.js"></script>
<script>
(function () {
  var $ = GR.$, el = GR.el, show = GR.show;
  var ENDPOINT = GR.endpoint("notes");
  function say(text, kind) { GR.say("msg", text, kind); }

  // No server check on open: the code is proven by the first note that goes through, so the page works with no signal.
  GR.boot({ key: "notes", init: false, ready: function () { renderBox(); flushSoon(); } });

  var mode = "replace";
  function setMode(m) {
    mode = m;
    $("modeReplace").setAttribute("aria-pressed", m === "replace");
    $("modeAppend").setAttribute("aria-pressed", m === "append");
  }
  $("modeReplace").onclick = function () { setMode("replace"); };
  $("modeAppend").onclick = function () { setMode("append"); };

  // What's typed or dictated stays on the phone until it's sent.
  GR.draft($("notes"), "notes");
  GR.draft($("job"), "notesJob");

  // ---- speech ----
  if (!GR.speech) {
    show($("micJob"), false); show($("micNotes"), false);
    $("notes").placeholder = "Voice input isn't supported in this browser. Use Chrome, or the microphone on your keyboard.";
  }
  var WORDS = { zero: 0, oh: 0, o: 0, one: 1, won: 1, two: 2, to: 2, too: 2, three: 3, four: 4, for: 4, five: 5,
                six: 6, seven: 7, eight: 8, ate: 8, nine: 9 };
  function toDigits(s) {
    return s.toLowerCase().replace(/[a-z]+/g, function (w) { return w in WORDS ? String(WORDS[w]) : " "; }).replace(/[^0-9-]/g, "");
  }
  $("micJob").onclick = function () {
    GR.listen($("micJob"), {
      continuous: false, onError: say,
      onText: function (_b, fin, interim) { var d = toDigits(fin + interim); if (d) $("job").value = d; }
    });
  };
  GR.micFor($("micNotes"), $("notes"), {
    label: function (on) { $("micNotesLabel").textContent = on ? "Listening… tap to stop" : "Tap to talk"; },
    onError: say
  });

  // ---- send ----
  $("send").onclick = function () {
    var b = $("send");
    if (b.disabled) return;
    // Still listening: stop the mic and wait for the last phrase before sending.
    b.disabled = true; b.textContent = "Finishing…";
    var done = false;
    function go() { if (done) return; done = true; b.disabled = false; send(); }
    GR.stopAll(go);
    setTimeout(go, 2500);
  };

  // ---- outbox: every note is saved on the phone first, then sent; anything that can't reach the
  //      server stays queued and goes out on its own when signal returns (or next time the page opens).
  var OUTBOX = "grNotesOutbox";
  var TIMEOUT_MS = 40000;   // a send normally takes 5–15 s (Haiku cleanup + HCP); past this we treat it as no signal
  function readBox() { var b = GR.getJ(OUTBOX, []); return Array.isArray(b) ? b : []; }
  function writeBox(b) { GR.put(OUTBOX, JSON.stringify(b)); renderBox(); }
  function boxUpdate(id, patch) { var b = readBox(); b.forEach(function (x) { if (x.id === id) Object.keys(patch).forEach(function (k) { x[k] = patch[k]; }); }); writeBox(b); }
  function boxRemove(id) { writeBox(readBox().filter(function (x) { return x.id !== id; })); }
  function when(t) { return new Date(t).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); }

  // One attempt at the server. Resolves {ok, text} for a real ✅/❌ reply; rejects on no signal, timeout, or an error
  // page from Google (so the note stays queued instead of being dropped).
  function post(item) {
    if (!ENDPOINT) return Promise.resolve({ ok: false, text: "❌ Job Notes isn't connected yet. Add its URL to config.js." });
    return GR.post(ENDPOINT, { token: item.token, job: item.job, summary: item.summary, mode: item.mode, req_id: item.id }, TIMEOUT_MS)
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then(function (t) {
        t = t.trim();
        if (t.indexOf("✅") !== 0 && t.indexOf("❌") !== 0) throw new Error("unexpected reply");
        GR.offline(false);
        return { ok: t.indexOf("✅") === 0, text: t };
      });
  }
  function sent(item, text) {
    boxRemove(item.id);
    GR.recent("Job Notes", "Job " + item.job);
    return text;
  }

  function send() {
    var code = GR.code() || $("code").value.trim();
    var job = $("job").value.trim();
    var notes = $("notes").value.trim();
    if (!code) { say("❌ Enter your access code first.", "err"); return; }
    if (!/^\d+(-\d+)?$/.test(job)) { say("❌ Say or type the job number.", "err"); return; }
    if (!notes) { say("❌ Add your details first.", "err"); return; }
    var item = { id: GR.rid(), token: code, job: job, summary: notes, mode: mode, at: Date.now() };
    var box = readBox(); box.push(item); writeBox(box);     // saved before we even try
    GR.drop("grDraft:notes"); GR.drop("grDraft:notesJob");
    var b = $("send");
    b.disabled = true; b.textContent = "Sending…"; say("");
    post(item).then(function (r) {
      if (r.ok) { say(sent(item, r.text), "ok"); $("notes").value = ""; setMode("replace"); }
      else {
        boxRemove(item.id); say(r.text, "err");   // the server answered: a real problem to fix here (job number, code…)
        if (/access code|Too many wrong/.test(r.text)) { GR.forgetCode(); GR.show($("codeCard"), true); GR.show($("app"), false); GR.say("codeMsg", r.text.replace(/^❌\s*/, ""), "err"); }
      }
    }).catch(function () {
      boxUpdate(item.id, { tries: 1, last: Date.now() });
      GR.offline(true);
      $("notes").value = ""; setMode("replace");
      say("📶 No signal — saved. Job " + job + " will send itself when you're back in range, or next time you open this page. (Anything you type now is a new note.)", "wait");
    }).then(function () { b.disabled = false; b.textContent = "Send to Housecall Pro"; flushSoon(); });
  }

  // ---- flush the queue: on open, when the phone comes back online, every minute while something waits ----
  var flushing = false, flushTimer = null;
  function flushSoon() { if (flushTimer) clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); }
  function flush(manualId) {
    if (flushing) return;
    var items = readBox().filter(function (x) { return manualId ? x.id === manualId : !x.err; });
    if (!items.length) return;
    flushing = true;
    var i = 0, anySent = false;
    (function next() {
      if (i >= items.length) { flushing = false; if (anySent) say("✅ Saved notes sent." + (readBox().length ? " " + readBox().length + " still waiting." : ""), "ok"); return; }
      var item = items[i++];
      if (!readBox().some(function (x) { return x.id === item.id; })) return next();   // deleted meanwhile
      boxUpdate(item.id, { sending: true });
      post(item).then(function (r) {
        if (r.ok) { sent(item, r.text); anySent = true; }
        else boxUpdate(item.id, { sending: false, err: r.text.replace(/^❌\s*/, "") });
        next();
      }).catch(function () {
        boxUpdate(item.id, { sending: false, tries: (item.tries || 0) + 1, last: Date.now() });
        flushing = false;   // no signal: stop here, the rest will fail the same way
        GR.offline(true);
        renderBox();
      });
    })();
  }
  function renderBox() {
    var box = readBox(), card = $("outboxCard"), list = $("outboxList");
    show(card, box.length > 0);
    list.innerHTML = "";
    box.forEach(function (x) {
      var d = el("div", "ob");
      d.appendChild(el("b", null, "Job " + x.job + " · " + when(x.at) + (x.mode === "append" ? " · add to details" : "")));
      d.appendChild(el("div", "txt", x.summary));
      d.appendChild(el("div", "st" + (x.err ? " err" : ""), x.sending ? "Sending…" : x.err ? "❌ " + x.err + " — fix it with Edit, or delete it." : "Waiting for signal" + (x.tries ? " · tried " + x.tries + "×" : "")));
      var acts = el("div", "acts");
      [["Send now", function () { boxUpdate(x.id, { err: "" }); flush(x.id); }],
       ["Edit", function () { $("job").value = x.job; $("notes").value = x.summary; setMode(x.mode === "append" ? "append" : "replace"); boxRemove(x.id); GR.saveDrafts(); window.scrollTo({ top: 0, behavior: "smooth" }); }],
       ["Delete", function () { if (confirm("Delete the saved note for job " + x.job + "?")) boxRemove(x.id); }]
      ].forEach(function (a) { var bt = el("button", null, a[0]); bt.onclick = a[1]; if (x.sending) bt.disabled = true; acts.appendChild(bt); });
      d.appendChild(acts);
      list.appendChild(d);
    });
  }
  window.addEventListener("online", flushSoon);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) flushSoon(); });
  setInterval(function () { if (!document.hidden && readBox().some(function (x) { return !x.err; })) flush(); }, 60000);
})();
</script>
</body>
</html>
